name: QUALIAR-UFAM (por hora)

on:
  schedule:
    # O GitHub atrasa ou pula execuções agendadas. Por isso há quatro tentativas
    # por hora: a primeira que rodar coleta; as outras encontram a hora já
    # coletada e terminam sem chamar a PurpleAir (trava em scripts/qualiar.py).
    # O disparo pelo Google Apps Script (scripts/google_apps_script.gs) é opcional.
    - cron: "5,20,35,50 * * * *"
  workflow_dispatch:
    inputs:
      semear:
        description: "Baixar também as últimas 24 h de médias horárias da PurpleAir (usar só na primeira vez)"
        type: boolean
        default: false
      forcar:
        description: "Coletar de novo mesmo que esta hora já tenha sido coletada"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: dados
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Sempre a versão mais recente da branch (um "Re-run" usaria o commit antigo
      # e entraria em conflito com os dados gravados depois dele).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar, prever e validar
        env:
          PURPLEAIR_API_KEY: ${{ secrets.PURPLEAIR_API_KEY }}
          INMET_TOKEN: ${{ secrets.INMET_TOKEN }}
        run: python scripts/qualiar.py ${{ inputs.semear && '--semear' || '' }} ${{ inputs.forcar && '--forcar' || '' }}
      - name: Publicar dados
        run: |
          git config user.name "qualiar-ufam[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then echo "Nada a publicar."; exit 0; fi
          git commit -m "Dados: $(TZ=America/Manaus date +'%d/%m %Hh')"
          # Se outra execução gravou dados no meio do caminho, prevalecem os desta
          # execução, que são os mais recentes. Até 3 tentativas.
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME:-main}" && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "Não foi possível publicar os dados depois de 3 tentativas." >&2
          exit 1
